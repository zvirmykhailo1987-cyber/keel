name = "Ruby"
markers = ["Gemfile", "Gemfile.lock", ".ruby-version"]
eol = ["ruby"]
watch = ["rails/rails", "ruby/ruby"]
pitfalls = ["N+1 запити в ActiveRecord", "Масове присвоєння без strong parameters", "Міграція без safety-перевірок блокує таблицю"]
maturity = "profile"
verified = "2026-11-06"

[commands]
test = "bundle exec rspec  # або rails test"
lint = "bundle exec rubocop"
audit = "bundle exec bundler-audit check --update"

[runtime_files]
".ruby-version" = "ruby|^(?:ruby-)?(\\d+\\.\\d+)"

[frameworks]
"rails" = ["rails"]
