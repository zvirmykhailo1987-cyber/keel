name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  selftest:
    name: selftest (${{ matrix.os }}, Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      # Third-party actions are pinned to a commit SHA, not a movable tag.
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c  # v6.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Engine self-tests (stdlib only, no network)
        shell: bash
        run: sh src/plugin/hooks/run.sh -m keel selftest
      - name: Secret scan of the repository with Keel's own scanner
        shell: bash
        run: PYTHONPATH=src/plugin/engine python -m keel scan .
      - name: Plugin and marketplace manifests are valid JSON
        shell: bash
        run: |
          python -c "import json,sys; [json.load(open(p, encoding='utf-8')) for p in sys.argv[1:]]" \
            .claude-plugin/marketplace.json src/plugin/.claude-plugin/plugin.json src/plugin/hooks/hooks.json

  coverage:
    # One OS is enough for the number; the matrix above proves the tests pass everywhere.
    # coverage.py is a dev-only tool installed here; the plugin itself stays stdlib-only at runtime.
    name: coverage (ubuntu-latest, Python 3.13)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c  # v6.0.0
        with:
          python-version: "3.13"
      - name: Install coverage.py (dev only, pinned)
        run: python -m pip install coverage==7.17.3
      - name: Self-tests under line+branch coverage, child processes included
        shell: bash
        env:
          PYTHONPATH: src/plugin/engine
          PYTHONUTF8: "1"
          PYTHONIOENCODING: utf-8
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python -m coverage run -m keel selftest
          python -m coverage combine -q
          python -m coverage report --fail-under=80
